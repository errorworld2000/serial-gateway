<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SERIAL GATEWAY</title>
    <!-- xterm.js -->
    <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
    <script src="/vendor/xterm/xterm.js"></script>
    <link rel="stylesheet" href="/commands.css">

    <style>
        :root {
            /* Nothing Design Tokens - Dark Mode */
            --black: #000000;
            --surface: #111111;
            --surface-raised: #1A1A1A;
            --border: #222222;
            --border-visible: #333333;
            --text-disabled: #666666;
            --text-secondary: #999999;
            --text-primary: #E8E8E8;
            --text-display: #FFFFFF;
            --accent: #D71921;
            --success: #4A9E5C;

            /* Typography */
            --font-display: "Segoe UI", Arial, sans-serif;
            --font-body: "Segoe UI", Arial, sans-serif;
            --font-mono: "Cascadia Mono", Consolas, "Courier New", monospace;
        }

        body {
            background-color: var(--black);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;

            /* Dot-matrix motif background */
            background-image: radial-gradient(circle, var(--border-visible) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        header {
            padding: 20px 24px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

		.header-actions {
			display: flex;
			gap: 8px;
		}

        button {
            font: inherit;
        }

        .settings-button,
        .action-button {
            border: 1px solid var(--border-visible);
            background: var(--surface-raised);
            color: var(--text-primary);
            padding: 9px 14px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 12px;
			text-decoration: none;
        }

        .settings-button:hover,
        .action-button:hover {
            border-color: var(--text-secondary);
            color: var(--text-display);
        }

        .action-button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 600;
            color: var(--text-display);
            margin: 0;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border-visible);
            padding-bottom: 0px;
        }

        .tab {
            background: transparent;
            border: 1px solid transparent;
            border-bottom: none;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 8px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--text-display);
            background: var(--surface);
            border: 1px solid var(--border-visible);
            border-bottom: 1px solid var(--surface);
            margin-bottom: -1px; /* Overlay border bottom */
        }

        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-disabled);
        }
        .status-indicator.connected {
            background-color: var(--success);
        }

        .terminal-containers {
            flex-grow: 1;
            min-height: 0;
            background-color: var(--surface);
            border: 1px solid var(--border-visible);
            border-top: none;
            margin: 0 24px 24px;
            position: relative;
        }

        .terminal-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-sizing: border-box;
            padding: 10px;
            display: none;
            overflow: hidden;
        }

        .terminal-container.active {
            display: block;
        }

        /* Customize xterm.js selection and scrollbar to match aesthetic */
        .xterm-viewport::-webkit-scrollbar {
            width: 8px;
        }
        .xterm-viewport::-webkit-scrollbar-track {
            background: var(--surface);
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: var(--border-visible);
        }
        .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: var(--text-disabled);
        }

        .settings-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.78);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .settings-overlay.hidden {
            display: none;
        }

        .settings-panel {
            width: min(760px, 100%);
            max-height: calc(100vh - 48px);
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--border-visible);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        .settings-header,
        .settings-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-visible);
        }

        .settings-actions {
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid var(--border-visible);
            border-bottom: none;
        }

        .settings-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .settings-content {
            padding: 24px;
        }

        .settings-section {
            margin-bottom: 28px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-section h3 {
            margin: 0 0 14px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label,
        .checkbox-label {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .field input,
        .field select {
            box-sizing: border-box;
            width: 100%;
            border: 1px solid var(--border-visible);
            background: var(--black);
            color: var(--text-primary);
            padding: 9px 10px;
            font-family: var(--font-mono);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .port-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 14px;
        }

        .settings-message {
            min-height: 20px;
            padding: 0 24px 16px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .settings-message.success { color: var(--success); }
        .settings-message.error { color: var(--accent); }

        @media (max-width: 700px) {
            header { padding: 12px 12px 6px; }
            h1 { font-size: 22px; }
            .terminal-containers { margin: 0 12px 12px; }
            .settings-grid { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
        }

    </style>
</head>
<body>
    <canvas id="signal-canvas" aria-hidden="true"></canvas>
    <header>
        <div class="title-row">
            <h1>Serial Gateway</h1>
			<div class="header-actions">
				<a class="settings-button" href="/api/docs" target="_blank" rel="noopener">API DOCS</a>
				<button class="settings-button" id="settings-open" type="button">PORT SETTINGS</button>
			</div>
        </div>
        <div class="tabs" id="tabs-container">
            <!-- Tabs will be dynamically added here -->
        </div>
    </header>

    <main class="workbench">
    <div class="terminal-containers" id="terminals-wrapper">
        <!-- Terminal divs will be dynamically added here -->
    </div>
    <aside class="command-panel" aria-label="常用命令">
        <button class="desk-pet" id="desk-pet" type="button" aria-label="逗逗点阵小猫" title="点一下，打个招呼">
            <svg viewBox="0 0 64 48" aria-hidden="true"><g fill="currentColor"><path d="M12 8h8v4h4v4h16v-4h4V8h8v28h-4v4H16v-4h-4z"/><path d="M8 28H4v12h12v-4H8zM20 40h8v4h-8zm16 0h8v4h-8z"/></g><g class="pet-eyes" fill="#181715"><path d="M20 23h5v5h-5zm19 0h5v5h-5z"/></g><path d="M29 31h6v3h-6z" fill="#181715"/></svg>
            <span><strong>DOT</strong><small id="pet-caption">陪你调试 · 点击打招呼</small></span>
        </button>
        <div class="command-heading"><strong>常用命令</strong><button class="action-button" id="command-add" type="button">＋ 新建</button></div>
        <p class="command-help">点击发送到当前串口。按钮保存在本浏览器。</p>
        <div id="command-list"></div>
        <form id="command-editor" hidden>
            <label>按钮名称<input id="command-name" required maxlength="60" placeholder="例如 load-usb"></label>
            <label>按钮颜色<select id="command-color"><option value="#4A9E5C">绿色</option><option value="#5195db">蓝色</option><option value="#ce9e45">黄色</option><option value="#D71921">红色</option></select></label>
            <label>发送内容<textarea id="command-text" rows="6" required spellcheck="false" placeholder="help\r"></textarea></label>
            <p class="command-help"><code>\r</code> 回车 · <code>\n</code> 换行 · <code>\p</code> 暂停一秒<br><code>\t</code> Tab · <code>\e</code> ESC · <code>\b</code> 退格 · <code>\\</code> 反斜杠<br>不自动追加回车；执行命令请在末尾加 <code>\r</code>。实际换行按回车发送。</p>
            <div class="command-heading"><button class="action-button" id="command-cancel" type="button">取消</button><button class="action-button primary" type="submit">保存按钮</button></div>
        </form>
        <p id="command-status" role="status" aria-live="polite"></p>
        <button class="action-button" id="command-stop" type="button" hidden>停止后续发送</button>
    </aside>
    </main>

    <div class="settings-overlay hidden" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-panel">
            <div class="settings-header">
                <h2 id="settings-title">Port settings</h2>
                <button class="action-button" id="settings-close" type="button">CLOSE</button>
            </div>
            <div class="settings-content">
                <section class="settings-section">
                    <h3>Serial ports</h3>
                    <label class="checkbox-label">
                        <input id="settings-all-ports" type="checkbox">
                        Automatically enable every detected port
                    </label>
                    <div class="port-list" id="settings-port-list"></div>
                </section>

                <section class="settings-section">
                    <h3>Serial format</h3>
                    <div class="settings-grid">
                        <div class="field">
                            <label for="settings-baud">Baud rate</label>
                            <input id="settings-baud" type="number" min="1">
                        </div>
                        <div class="field">
                            <label for="settings-data-bits">Data bits</label>
                            <select id="settings-data-bits"><option>5</option><option>6</option><option>7</option><option>8</option></select>
                        </div>
                        <div class="field">
                            <label for="settings-parity">Parity</label>
                            <select id="settings-parity"><option value="none">None</option><option value="odd">Odd</option><option value="even">Even</option><option value="mark">Mark</option><option value="space">Space</option></select>
                        </div>
                        <div class="field">
                            <label for="settings-stop-bits">Stop bits</label>
                            <select id="settings-stop-bits"><option value="1">1</option><option value="1.5">1.5</option><option value="2">2</option></select>
                        </div>
                    </div>
                </section>

                <section class="settings-section">
                    <h3>Network and terminal</h3>
                    <div class="settings-grid">
                        <div class="field full">
                            <label for="settings-http-address">Web/API address</label>
                            <input id="settings-http-address" type="text">
                        </div>
                        <div class="field">
                            <label for="settings-tcp-host">Raw TCP host</label>
                            <input id="settings-tcp-host" type="text">
                        </div>
                        <div class="field">
                            <label for="settings-tcp-base">TCP base port</label>
                            <input id="settings-tcp-base" type="number" min="1" max="65535">
                        </div>
                        <label class="checkbox-label field full">
                            <input id="settings-telnet-enabled" type="checkbox">
                            Enable SecureCRT Telnet endpoints
                        </label>
                        <div class="field">
                            <label for="settings-telnet-host">Telnet host</label>
                            <input id="settings-telnet-host" type="text">
                        </div>
                        <div class="field">
                            <label for="settings-telnet-base">Telnet base port</label>
                            <input id="settings-telnet-base" type="number" min="1" max="65535">
                        </div>
                        <div class="field">
                            <label for="settings-escape-delay">Escape delay (ms)</label>
                            <input id="settings-escape-delay" type="number" min="0">
                        </div>
                        <div class="field">
                            <label for="settings-scan-interval">Scan interval (ms)</label>
                            <input id="settings-scan-interval" type="number" min="1">
                        </div>
                        <label class="checkbox-label field full">
                            <input id="settings-normalize-crlf" type="checkbox">
                            Convert CRLF input to CR for interactive serial consoles
                        </label>
                    </div>
                </section>
            </div>
            <div class="settings-message" id="settings-message"></div>
            <div class="settings-actions">
                <button class="action-button" id="settings-cancel" type="button">CANCEL</button>
                <button class="action-button primary" id="settings-save" type="button">SAVE SETTINGS</button>
            </div>
        </div>
    </div>

    <script>
        const tabsContainer = document.getElementById('tabs-container');
        const terminalsWrapper = document.getElementById('terminals-wrapper');
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsMessage = document.getElementById('settings-message');
        const settingsPortList = document.getElementById('settings-port-list');

        const sessions = {};
        let activePort = null;
        let settingsConfig = null;

        let refreshing = false;

        function fitTerminal(session) {
            if (!session || !session.container.classList.contains('active')) return;

            const dimensions = session.term._core?._renderService?.dimensions?.css?.cell;
            let cellWidth = dimensions?.width || 0;
            let cellHeight = dimensions?.height || 0;
            if (!cellWidth || !cellHeight) {
                const screen = session.term.element?.querySelector('.xterm-screen');
                const bounds = screen?.getBoundingClientRect();
                cellWidth = bounds?.width / session.term.cols || 0;
                cellHeight = bounds?.height / session.term.rows || 0;
            }
            if (!cellWidth || !cellHeight) return;

            const style = getComputedStyle(session.container);
            const availableWidth = session.container.clientWidth
                - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            const availableHeight = session.container.clientHeight
                - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
            const cols = Math.max(2, Math.floor(availableWidth / cellWidth));
            const rows = Math.max(1, Math.floor(availableHeight / cellHeight));

            if (cols !== session.term.cols || rows !== session.term.rows) {
                session.term.resize(cols, rows);
            }
        }

        function setSettingsMessage(message, type = '') {
            settingsMessage.textContent = message;
            settingsMessage.className = `settings-message ${type}`;
        }

        function setSettingsOpen(open) {
            settingsOverlay.classList.toggle('hidden', !open);
            if (!open) setSettingsMessage('');
        }

        function naturalPortSort(a, b) {
            const numA = parseInt(a.replace(/\D/g, '')) || 0;
            const numB = parseInt(b.replace(/\D/g, '')) || 0;
            return numA - numB || a.localeCompare(b);
        }

        async function openSettings() {
            setSettingsOpen(true);
            setSettingsMessage('Loading settings...');
            try {
                const response = await fetch('/api/v1/config');
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
                settingsConfig = payload.config;
                populateSettings(settingsConfig, payload.detected_ports || []);
                setSettingsMessage('');
            } catch (error) {
                setSettingsMessage(`Failed to load settings: ${error.message}`, 'error');
            }
        }

        function populateSettings(config, detectedPorts) {
            const configuredPorts = config.serial.ports || [];
            const allPorts = configuredPorts.length === 0;
            const portNames = [...new Set([...detectedPorts, ...configuredPorts])].sort(naturalPortSort);
            document.getElementById('settings-all-ports').checked = allPorts;
            settingsPortList.innerHTML = '';
            if (portNames.length === 0) {
                settingsPortList.textContent = 'No serial ports detected.';
            }
            portNames.forEach(portName => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = portName;
                checkbox.checked = allPorts || configuredPorts.includes(portName);
                checkbox.disabled = allPorts;
                checkbox.dataset.port = 'true';
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(portName));
                settingsPortList.appendChild(label);
            });
            document.getElementById('settings-baud').value = config.serial.baud_rate;
            document.getElementById('settings-data-bits').value = config.serial.data_bits;
            document.getElementById('settings-parity').value = config.serial.parity;
            document.getElementById('settings-stop-bits').value = config.serial.stop_bits;
            document.getElementById('settings-http-address').value = config.http.address;
            document.getElementById('settings-tcp-host').value = config.tcp.host;
            document.getElementById('settings-tcp-base').value = config.tcp.base_port;
			document.getElementById('settings-telnet-enabled').checked = config.telnet.enabled;
			document.getElementById('settings-telnet-host').value = config.telnet.host;
			document.getElementById('settings-telnet-base').value = config.telnet.base_port;
            document.getElementById('settings-escape-delay').value = config.tcp.escape_delay_ms;
            document.getElementById('settings-normalize-crlf').checked = config.tcp.normalize_crlf;
            document.getElementById('settings-scan-interval').value = config.scan_interval_ms;
        }

        function toggleAllPorts() {
            const allPorts = document.getElementById('settings-all-ports').checked;
            settingsPortList.querySelectorAll('input[data-port]').forEach(checkbox => {
                checkbox.disabled = allPorts;
                if (allPorts) checkbox.checked = true;
            });
        }

        async function saveSettings() {
            if (!settingsConfig) return;
            const allPorts = document.getElementById('settings-all-ports').checked;
            const selectedPorts = [...settingsPortList.querySelectorAll('input[data-port]:checked')].map(input => input.value);
            if (!allPorts && selectedPorts.length === 0) {
                setSettingsMessage('Select at least one port, or enable all detected ports.', 'error');
                return;
            }
            const updated = JSON.parse(JSON.stringify(settingsConfig));
            updated.serial.ports = allPorts ? [] : selectedPorts;
            updated.serial.baud_rate = Number(document.getElementById('settings-baud').value);
            updated.serial.data_bits = Number(document.getElementById('settings-data-bits').value);
            updated.serial.parity = document.getElementById('settings-parity').value;
            updated.serial.stop_bits = document.getElementById('settings-stop-bits').value;
            updated.http.address = document.getElementById('settings-http-address').value.trim();
            updated.tcp.host = document.getElementById('settings-tcp-host').value.trim();
            updated.tcp.base_port = Number(document.getElementById('settings-tcp-base').value);
            updated.tcp.escape_delay_ms = Number(document.getElementById('settings-escape-delay').value);
            updated.tcp.normalize_crlf = document.getElementById('settings-normalize-crlf').checked;
			updated.telnet.enabled = document.getElementById('settings-telnet-enabled').checked;
			updated.telnet.host = document.getElementById('settings-telnet-host').value.trim();
			updated.telnet.base_port = Number(document.getElementById('settings-telnet-base').value);
            updated.scan_interval_ms = Number(document.getElementById('settings-scan-interval').value);
            setSettingsMessage('Saving settings...');
            try {
                const response = await fetch('/api/v1/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updated)
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
                settingsConfig = payload.config;
                populateSettings(settingsConfig, payload.detected_ports || []);
                if (payload.apply_error) {
                    setSettingsMessage(`Saved, but port refresh failed: ${payload.apply_error}`, 'error');
                } else if (payload.restart_required) {
                    setSettingsMessage('Saved. Restart Serial Gateway to apply non-port changes.', 'success');
                } else {
                    setSettingsMessage('Saved and applied.', 'success');
                }
                setTimeout(refreshPorts, 300);
            } catch (error) {
                setSettingsMessage(`Failed to save settings: ${error.message}`, 'error');
            }
        }

        async function refreshPorts() {
            if (refreshing) return;
            refreshing = true;
            try {
                const response = await fetch('/api/v1/ports');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const payload = await response.json();
                const ports = payload.ports || [];

                if (ports.length === 0 && Object.keys(sessions).length === 0) {
                    tabsContainer.innerHTML = '<div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); padding: 8px 0;">[NO PORTS DETECTED]</div>';
                    return;
                }

                ports.sort((a, b) => naturalPortSort(a.name, b.name));

                ports.forEach(status => {
                    if (!sessions[status.name]) {
                        if (Object.keys(sessions).length === 0) tabsContainer.innerHTML = '';
                        createSession(status);
                    }
                    updateSession(sessions[status.name], status);
                });

                if (!activePort && ports.length > 0) {
                    selectTab(ports[0].name);
                }
            } catch (error) {
                console.error('Failed to fetch ports:', error);
                if (Object.keys(sessions).length === 0) {
                    tabsContainer.innerHTML = '<div style="font-family: var(--font-mono); font-size: 12px; color: var(--accent); padding: 8px 0;">[ERROR FETCHING PORTS]</div>';
                }
            } finally {
                refreshing = false;
            }
        }

        function createSession(status) {
            const portName = status.name;
            // Tab Element
            const tabEl = document.createElement('button');
            tabEl.className = 'tab';

            const indicatorEl = document.createElement('div');
            indicatorEl.className = 'status-indicator';

            const labelEl = document.createElement('span');
            labelEl.innerText = portName;

            tabEl.appendChild(indicatorEl);
            tabEl.appendChild(labelEl);

            tabEl.onclick = () => selectTab(portName);
            tabsContainer.appendChild(tabEl);

            // Terminal Container
            const containerEl = document.createElement('div');
            containerEl.className = 'terminal-container';
            terminalsWrapper.appendChild(containerEl);

            // Initialize xterm.js
            const term = new Terminal({
                allowTransparency: true,
                cursorBlink: true,
                fontFamily: 'Cascadia Mono, Consolas, Courier New, monospace',
                fontSize: 14,
                lineHeight: 1.2,
                theme: {
                    background: '#00000000',
                    foreground: '#e8e2d8',
                    cursor: '#d49779',
                    selectionBackground: '#65534799',
                    black: '#252320', red: '#cf8273', green: '#a4ad89', yellow: '#d0b483',
                    blue: '#91a3b0', magenta: '#b49aa8', cyan: '#9fbbb5', white: '#ded8ce',
                    brightBlack: '#8c867e', brightRed: '#e5a08e', brightGreen: '#bcc79d', brightYellow: '#e6cc9c',
                    brightBlue: '#afc0ca', brightMagenta: '#ccb0bd', brightCyan: '#bbd5cc', brightWhite: '#f4efe6'
                }
            });
            term.open(containerEl);
            // Capture before xterm's context-menu handler changes the selection.
            containerEl.addEventListener('contextmenu', async event => {
                if (event.shiftKey) return;
                const selection = term.getSelection();
                const clipboard = navigator.clipboard;
                // Keep the native menu available on insecure HTTP origins.
                if (!clipboard || (selection ? !clipboard.writeText : !clipboard.readText)) return;
                event.preventDefault();
                event.stopPropagation();
                try {
                    if (selection) {
                        await clipboard.writeText(selection);
                        term.clearSelection();
                    } else {
                        const text = await clipboard.readText();
                        if (!containerEl.isConnected) return;
                        term.paste(text);
                    }
                    term.focus();
                } catch (error) {
                    console.warn('Terminal clipboard access failed', error);
                    alert('浏览器未允许访问剪贴板。请允许剪贴板权限，或按住 Shift 右键使用菜单复制粘贴。');
                }
            }, true);
            containerEl.title = '选中文字后右键复制，未选中时右键粘贴；Shift+右键打开菜单';

            const session = {
                portName,
                tab: tabEl,
                indicator: indicatorEl,
                container: containerEl,
                term,
                socket: null,
                tcpAddress: status.tcp_address,
				telnetAddress: status.telnet_address,
                connected: false
            };

            session.resizeObserver = new ResizeObserver(() => fitTerminal(session));
            session.resizeObserver.observe(containerEl);

            term.onData(data => {
                if (session.socket && session.socket.readyState === WebSocket.OPEN) {
                    session.socket.send(data);
                }
            });

            sessions[portName] = session;
        }

        function connectSession(session) {
            if (session.socket && (session.socket.readyState === WebSocket.OPEN || session.socket.readyState === WebSocket.CONNECTING)) return;
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?port=${encodeURIComponent(session.portName)}`;
            const socket = new WebSocket(wsUrl);
            socket.binaryType = 'arraybuffer';
            session.socket = socket;

            socket.onopen = () => {
                session.indicator.classList.add('connected');
				session.term.writeln(`\x1b[32m[SYS] WEB TERMINAL CONNECTED DIRECTLY TO ${session.portName}\x1b[0m`);
				session.term.writeln(`\x1b[90m[SYS] SECURECRT TELNET ${session.telnetAddress || 'DISABLED'} · RAW TCP ${session.tcpAddress}\x1b[0m\r\n`);
            };

            socket.onmessage = (event) => {
                if (event.data instanceof ArrayBuffer) {
                    session.term.write(new Uint8Array(event.data));
                } else {
                    session.term.write(event.data);
                }
            };

            socket.onclose = () => {
                session.indicator.classList.remove('connected');
                if (session.socket === socket) session.socket = null;
                session.term.writeln(`\x1b[31m\r\n[SYS] DISCONNECTED FROM ${session.portName}\x1b[0m`);
            };

            socket.onerror = (error) => {
                console.error(`WebSocket error on ${session.portName}`, error);
            };
        }

        function updateSession(session, status) {
            session.tcpAddress = status.tcp_address;
			session.telnetAddress = status.telnet_address;
            session.connected = status.connected;
			session.tab.title = `Serial ${status.name} @ ${status.baud_rate} ${status.data_bits}${status.parity}${status.stop_bits} · SecureCRT Telnet ${status.telnet_address || 'disabled'} · Raw ${status.tcp_address}`;
            if (status.connected) {
                connectSession(session);
            } else {
                session.indicator.classList.remove('connected');
                if (session.socket) {
                    const socket = session.socket;
                    session.socket = null;
                    socket.close();
                }
            }
        }

        function selectTab(portName) {
            const changed = activePort !== portName;
            Object.values(sessions).forEach(s => {
                s.tab.classList.remove('active');
                s.container.classList.remove('active');
            });

            const session = sessions[portName];
            if (session) {
                session.tab.classList.add('active');
                session.container.classList.add('active');
                activePort = portName;
                if (changed) document.dispatchEvent(new CustomEvent('terminal-switch', { detail: { container: session.container } }));
                requestAnimationFrame(() => {
                    fitTerminal(session);
                    session.term.focus();
                });
            }
        }

        window.addEventListener('resize', () => {
            if (activePort) fitTerminal(sessions[activePort]);
        });

        refreshPorts();
        setInterval(refreshPorts, 2000);
        document.getElementById('settings-open').addEventListener('click', openSettings);
        document.getElementById('settings-close').addEventListener('click', () => setSettingsOpen(false));
        document.getElementById('settings-cancel').addEventListener('click', () => setSettingsOpen(false));
        document.getElementById('settings-save').addEventListener('click', saveSettings);
        document.getElementById('settings-all-ports').addEventListener('change', toggleAllPorts);
        settingsOverlay.addEventListener('click', event => {
            if (event.target === settingsOverlay) setSettingsOpen(false);
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && !settingsOverlay.classList.contains('hidden')) setSettingsOpen(false);
        });
    </script>
    <script src="/commands.js"></script>
    <script>initCommands(() => sessions[activePort]);</script>
    <script type="module" src="/signal-field.js"></script>
    <script src="/workbench-effects.js"></script>
</body>
</html>
